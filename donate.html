<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Донат группы - GribLand</title>
    <style>
        :root { --bg-color: #1a1625; --card-bg: #2d243d; --accent-color: #ff4a75; --text-color: #f3effa; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); text-align: center; margin:0; padding:0; }
        header { background: #2d243d; padding: 20px; }
        header a { color: white; margin: 0 10px; text-decoration: none; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 40px; padding: 20px; }
        .price-card { background: var(--card-bg); padding: 30px; border-radius: 10px; width: 250px; border: 2px solid var(--accent-color); }
        .price { font-size: 1.8rem; color: #fff; margin: 15px 0; }
    </style>
</head>
<body>

    <header>
        <h2>Привилегии и Донат</h2>
        <nav>
            <a href="index.html">На главную</a>
            <a href="technomagic.html">О сервере</a>
        </nav>
    </header>

    <div class="grid">
        <div class="price-card">
            <h3>Грибник</h3>
            <div class="price">149 ₽ / мес</div>
            <p>Базовый набор ресурсов, префикс в чате и доступ к базовым командам.</p>
        </div>
        <div class="price-card">
            <h3>Мухомор</h3>
            <div class="price">399 ₽ / мес</div>
            <p>Увеличенные приваты, полёт (/fly), эксклюзивные киты каждый день.</p>
        </div>
    </div>

</body>
</html>
